name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-e2e:
    name: "Frontend: lint & E2E"
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: bun,rust
    steps:
      - uses: actions/checkout@v7

      - name: Setup project tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.8

      - name: Prepare application tools without Node
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/roomtemp-without-node"
          mkdir -p "$tool_dir"
          IFS=: read -ra tool_paths <<< "$PATH"
          for tool_path in "${tool_paths[@]}"; do
            for tool in "$tool_path"/*; do
              [ -f "$tool" ] && [ -x "$tool" ] || continue
              tool_name="${tool##*/}"
              case "$tool_name" in node|nodejs|npm|npx|pnpm|pnpx|corepack) continue ;; esac
              [ -e "$tool_dir/$tool_name" ] || ln -s "$tool" "$tool_dir/$tool_name"
            done
          done
          echo "ROOMTEMP_TOOL_PATH=$tool_dir:$HOME/.cargo/bin" >> "$GITHUB_ENV"

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('mise.toml', '.bun-version', 'bun.lock', 'bunfig.toml', 'package.json') }}

      - name: Install dependencies
        run: |
          export PATH="$ROOMTEMP_TOOL_PATH"
          for tool in node nodejs npm npx pnpm pnpx corepack; do
            if command -v "$tool"; then
              exit 1
            fi
          done
          bun install --frozen-lockfile

      - name: Install Tauri native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          libglib2.0-dev \
          libgtk-4-1 \
          libgtk-3-dev \
          webkit2gtk-driver \
          xvfb

      - name: Run typecheck
        run: |
          export PATH="$ROOMTEMP_TOOL_PATH"
          bun --bun run typecheck
          bun --bun run typecheck:compat

      - name: Run ESLint
        run: |
          export PATH="$ROOMTEMP_TOOL_PATH"
          bun --bun run lint:eslint

      - uses: cargo-bins/cargo-binstall@main

      - name: Install tauri-driver via cargo-binstall
        run: cargo binstall tauri-driver --locked --force --no-confirm

      - name: Run tauri WebDriver suite
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          export PATH="$ROOMTEMP_TOOL_PATH"
          xvfb-run -a bun --bun run test:e2e
  rust-tests:
    name: "Rust: tests & coverage"
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install packages which are required for tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup project tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.8
          cache_key_prefix: mise-rust

      - uses: cargo-bins/cargo-binstall@main

      - name: Run cargo tests
        working-directory: src-tauri
        run: cargo test --workspace --all-features

      - name: Install LLVM (for coverage)
        run: sudo apt-get update && sudo apt-get install -y llvm clang lld

      - name: Install cargo-llvm-cov
        run: cargo binstall cargo-llvm-cov --locked --force --no-confirm
        working-directory: src-tauri

      - name: Generate coverage (lcov)
        working-directory: src-tauri
        run: cargo llvm-cov --workspace --no-clean

      - name: Print human-readable coverage summary
        working-directory: src-tauri
        run: cargo llvm-cov --workspace --no-clean --text --show-missing-lines || true
