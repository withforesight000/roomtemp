[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
# rust-version = "1.77.2"

# どうやら、これを指定すると、pnpm tauri dev でエラーになる
# build = "src/build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-prost-build = "0.14"

[dependencies]
# core crates used on all platforms
base64 = "0"
chacha20poly1305 = "0.11"
diesel = { version = "2", features = ["r2d2", "sqlite"] }
diesel_migrations = "2"
http = "1"
hyper-http-proxy = "1.1"
hyper-util = "0.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
tauri = { version = "2.12", features = [] }
# tauri-plugin-log = "2.6.0"
tempgrpcd-protos = { git = "https://github.com/withforesight000/protobuf-rust.git", package = "tempgrpcd-protos" }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tonic-prost = "0.14"
tonic-reflection = "0.14"
once_cell = "1"
keyring-core = "1"
pbjson-types = "0.8.0"
prost = "0.14"
r2d2 = "0.8"
rand = "0.10"
# https://zenn.dev/myuna/scraps/a1bfaefe24dd24
# 明示的にrustlsを指定する
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
thiserror = "2"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { version = "1", features = ["legacy"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1"

[dev-dependencies]
mockall = "0.15"
tempfile = "3"

chacha20poly1305_legacy = { package = "chacha20poly1305", version = "0.10.1" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
keyring_legacy = { package = "keyring", version = "3", features = ["apple-native"] }
