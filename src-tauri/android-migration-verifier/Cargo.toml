[package]
name = "roomtemp-migration-probe"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
once_cell = "1"
thiserror = "2"
keyring-core = "1"
android-native-keyring-store = { version = "1", features = ["legacy"] }
android-store-old = { package = "android-native-keyring-store", version = "=0.4.0", features = ["ndk-context"] }
keyring-core-old = { package = "keyring-core", version = "0.6" }
ndk-context = "0.1"
jni = "0.21"
diesel = { version = "2.3.14", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
